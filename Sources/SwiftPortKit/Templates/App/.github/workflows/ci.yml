name: SwiftPort CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: Apple (macOS + contracts + snapshots)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build swiftport CLI
        run: |
          git clone --depth 1 "${SWIFTPORT_REPO:-https://github.com/nitiptc/swiftport}" /tmp/swiftport-src
          swift build -c release --package-path /tmp/swiftport-src
          echo "/tmp/swiftport-src/.build/release" >> "$GITHUB_PATH"

      - name: Toolchain check
        run: swiftport doctor --platforms apple

      - name: Sync bridges & projects
        run: swiftport sync

      - name: Build Apple target
        run: swiftport build --target apple --release

      - name: Verify contracts
        run: swiftport verify --mode contracts

      - name: Capture snapshots
        # Golden comparison is machine-sensitive (font rasterization differs
        # across hosts); CI captures the full matrix as artifacts for review.
        # Strict diff runs locally via `swiftport verify --mode snapshots`.
        run: swiftport verify --mode snapshots --capture-only

      - name: Upload current snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-apple
          path: Verification/Snapshots/current/
          if-no-files-found: ignore

  linux:
    name: Linux (GTK4 + contracts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-4-dev libadwaita-1-dev

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build swiftport CLI
        run: |
          git clone --depth 1 "${SWIFTPORT_REPO:-https://github.com/nitiptc/swiftport}" /tmp/swiftport-src
          swift build -c release --package-path /tmp/swiftport-src
          echo "/tmp/swiftport-src/.build/release" >> "$GITHUB_PATH"

      - name: Toolchain check
        run: swiftport doctor --platforms linux

      - name: Verify contracts + build Linux target
        run: |
          swiftport verify --mode contracts --platforms linux
          swiftport build --target linux --release

  android:
    name: Android (Gradle + Paparazzi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      # GitHub's ubuntu image ships the Android SDK; ANDROID_HOME is preset.
      - name: Build swiftport CLI
        run: |
          git clone --depth 1 "${SWIFTPORT_REPO:-https://github.com/nitiptc/swiftport}" /tmp/swiftport-src
          swift build -c release --package-path /tmp/swiftport-src
          echo "/tmp/swiftport-src/.build/release" >> "$GITHUB_PATH"

      - name: Toolchain check
        run: swiftport doctor --platforms android

      - name: Verify contracts
        run: swiftport verify --mode contracts --platforms android

      - name: Record Paparazzi screenshots
        # Golden comparison is machine-sensitive; CI captures the matrix as
        # artifacts. Strict diff runs locally via `swiftport verify`.
        run: swiftport verify --mode snapshots --platforms android --capture-only

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots-android
          path: Verification/Snapshots/current/android/
          if-no-files-found: ignore

      - name: Build APK
        run: swiftport build --target android --release

  windows:
    name: Windows (dotnet + contracts)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build swiftport CLI
        shell: pwsh
        run: |
          git clone --depth 1 "${env:SWIFTPORT_REPO:-https://github.com/nitiptc/swiftport}" C:\swiftport-src
          swift build -c release --package-path C:\swiftport-src
          echo "C:\swiftport-src\.build\release" >> $env:GITHUB_PATH

      - name: Toolchain check
        run: swiftport doctor --platforms windows

      - name: Verify contracts
        run: swiftport verify --mode contracts --platforms windows

      - name: Build WinUI app
        run: swiftport build --target windows --release

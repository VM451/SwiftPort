<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">SwiftPort — one pure-Swift core, native UIs on every OS</title>
  <desc id="desc">SwiftPort title beside four platform windows — macOS, Android, Windows and Linux — each rendering the same tasks from a shared Core/ via contract fixtures.</desc>

  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.05"/>
    </pattern>
    <clipPath id="win-apple"><rect x="616" y="40" width="244" height="126" rx="12"/></clipPath>
    <clipPath id="win-android"><rect x="900" y="40" width="244" height="126" rx="12"/></clipPath>
    <clipPath id="win-windows"><rect x="616" y="204" width="244" height="126" rx="12"/></clipPath>
    <clipPath id="win-linux"><rect x="900" y="204" width="244" height="126" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#0D0F12"/>
  <rect width="1200" height="400" rx="26" fill="url(#dots)"/>

  <!-- ============ left: identity ============ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- port mark: one core fanning out to four ports -->
    <g>
      <rect x="56" y="55" width="9" height="9" rx="2" fill="#F05138"/>
      <path d="M65 59.5 H70 M70 47 V73 M70 47 H76 M70 56 H76 M70 64 H76 M70 73 H76"
            stroke="#6B7484" stroke-width="1.5" fill="none"/>
      <rect x="76" y="44" width="6" height="6" rx="1.5" fill="none" stroke="#6B7484" stroke-width="1.5"/>
      <rect x="76" y="53" width="6" height="6" rx="1.5" fill="none" stroke="#6B7484" stroke-width="1.5"/>
      <rect x="76" y="61" width="6" height="6" rx="1.5" fill="none" stroke="#6B7484" stroke-width="1.5"/>
      <rect x="76" y="70" width="6" height="6" rx="1.5" fill="none" stroke="#6B7484" stroke-width="1.5"/>
    </g>
    <text x="96" y="66" font-size="16" letter-spacing="2.5" fill="#8B94A3">SWIFT CLI + MONOREPO TEMPLATE</text>
  </g>

  <text x="56" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="86" font-weight="750" fill="#F2F4F7">SwiftPort</text>
  <rect x="435" y="96" width="16" height="58" rx="3" fill="#F05138"/>

  <text x="56" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25" fill="#C7CEDA">One pure-Swift core. Truly native UIs</text>
  <text x="56" y="233" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="25" fill="#C7CEDA">on macOS, iOS, Android, Windows, Linux.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <rect x="56" y="258" width="470" height="54" rx="10" fill="#12151A" stroke="#262C36" stroke-width="1.5"/>
    <text x="80" y="291" font-size="20"><tspan fill="#F05138">$ </tspan><tspan fill="#F2F4F7">swiftport init TaskFlow</tspan></text>
    <rect x="396" y="272" width="11" height="26" rx="2" fill="#F05138" opacity="0.85"/>
    <text x="56" y="346" font-size="15" fill="#8B94A3">Swift 6 · MIT · macOS · iOS · Android · Windows · Linux</text>
  </g>

  <!-- ============ right: core feeds four native windows ============ -->
  <!-- distribution spine in the corridor x860–900 -->
  <path d="M860 103 H880 V167 M880 203 V267 M880 267 H860 M880 103 H900 M880 267 H900"
        stroke="#39424F" stroke-width="1.5" fill="none"/>
  <circle cx="880" cy="103" r="2.5" fill="#6B7484"/>
  <circle cx="880" cy="267" r="2.5" fill="#6B7484"/>
  <circle cx="860" cy="103" r="3" fill="#F05138"/>
  <circle cx="900" cy="103" r="3" fill="#F05138"/>
  <circle cx="860" cy="267" r="3" fill="#F05138"/>
  <circle cx="900" cy="267" r="3" fill="#F05138"/>

  <!-- hub -->
  <rect x="795" y="167" width="170" height="36" rx="10" fill="#12151A" stroke="#F05138" stroke-width="1.5"/>
  <text x="880" y="191" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" font-weight="700" fill="#F2F4F7">Core/</text>

  <!-- Apple window (top-left): traffic lights, centered title -->
  <g clip-path="url(#win-apple)">
    <rect x="616" y="40" width="244" height="126" fill="#161A20"/>
    <rect x="616" y="40" width="244" height="34" fill="#1B2028"/>
  </g>
  <rect x="616" y="40" width="244" height="126" rx="12" fill="none" stroke="#262C36" stroke-width="1.5"/>
  <circle cx="634" cy="57" r="4" fill="#FF5F57"/>
  <circle cx="650" cy="57" r="4" fill="#FEBC2E"/>
  <circle cx="666" cy="57" r="4" fill="#28C840"/>
  <text x="738" y="63" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="600" fill="#C7CEDA">TaskFlow</text>
  <circle cx="640" cy="97" r="7" fill="#3FB950"/>
  <path d="M636.5 97 l2.5 2.5 l4.5 -5" stroke="#0D0F12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="656" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#8B94A3">Write the PRD</text>
  <circle cx="640" cy="129" r="7" fill="none" stroke="#5A6472" stroke-width="1.5"/>
  <text x="656" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#C7CEDA">Ship the Linux build</text>
  <text x="632" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#5A6472">macOS + iOS · SwiftUI</text>

  <!-- Android window (top-right): left title, overflow dots -->
  <g clip-path="url(#win-android)">
    <rect x="900" y="40" width="244" height="126" fill="#161A20"/>
    <rect x="900" y="40" width="244" height="34" fill="#1B2028"/>
  </g>
  <rect x="900" y="40" width="244" height="126" rx="12" fill="none" stroke="#262C36" stroke-width="1.5"/>
  <text x="916" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="600" fill="#C7CEDA">TaskFlow</text>
  <circle cx="1122" cy="51" r="1.7" fill="#8B94A3"/>
  <circle cx="1122" cy="57" r="1.7" fill="#8B94A3"/>
  <circle cx="1122" cy="63" r="1.7" fill="#8B94A3"/>
  <rect x="916" y="90" width="14" height="14" rx="3" fill="#3FB950"/>
  <path d="M919.5 97 l2.5 2.5 l4.5 -5" stroke="#0D0F12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="940" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#8B94A3">Write the PRD</text>
  <rect x="916" y="122" width="14" height="14" rx="3" fill="none" stroke="#5A6472" stroke-width="1.5"/>
  <text x="940" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#C7CEDA">Ship the Linux build</text>
  <text x="916" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#5A6472">Android · Jetpack Compose</text>

  <!-- Windows window (bottom-left): caption buttons -->
  <g clip-path="url(#win-windows)">
    <rect x="616" y="204" width="244" height="126" fill="#161A20"/>
    <rect x="616" y="204" width="244" height="34" fill="#1B2028"/>
  </g>
  <rect x="616" y="204" width="244" height="126" rx="12" fill="none" stroke="#262C36" stroke-width="1.5"/>
  <text x="632" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="600" fill="#C7CEDA">TaskFlow</text>
  <path d="M812 221 h8" stroke="#8B94A3" stroke-width="1.5"/>
  <rect x="826" y="216.5" width="9" height="9" fill="none" stroke="#8B94A3" stroke-width="1.5"/>
  <path d="M842 217 l8 8 M850 217 l-8 8" stroke="#8B94A3" stroke-width="1.5"/>
  <rect x="632" y="254" width="14" height="14" rx="2" fill="#3FB950"/>
  <path d="M635.5 261 l2.5 2.5 l4.5 -5" stroke="#0D0F12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="656" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#8B94A3">Write the PRD</text>
  <rect x="632" y="286" width="14" height="14" rx="2" fill="none" stroke="#5A6472" stroke-width="1.5"/>
  <text x="656" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#C7CEDA">Ship the Linux build</text>
  <text x="632" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#5A6472">Windows · WinUI 3</text>

  <!-- Linux window (bottom-right): centered title, single close -->
  <g clip-path="url(#win-linux)">
    <rect x="900" y="204" width="244" height="126" fill="#161A20"/>
    <rect x="900" y="204" width="244" height="34" fill="#1B2028"/>
  </g>
  <rect x="900" y="204" width="244" height="126" rx="12" fill="none" stroke="#262C36" stroke-width="1.5"/>
  <text x="1022" y="227" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" font-weight="600" fill="#C7CEDA">TaskFlow</text>
  <circle cx="1126" cy="221" r="9" fill="none" stroke="#5A6472" stroke-width="1.5"/>
  <path d="M1122.5 217.5 l7 7 M1129.5 217.5 l-7 7" stroke="#8B94A3" stroke-width="1.5"/>
  <circle cx="924" cy="261" r="7" fill="#3FB950"/>
  <path d="M920.5 261 l2.5 2.5 l4.5 -5" stroke="#0D0F12" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="940" y="266" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#8B94A3">Write the PRD</text>
  <circle cx="924" cy="293" r="7" fill="none" stroke="#5A6472" stroke-width="1.5"/>
  <text x="940" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="15" fill="#C7CEDA">Ship the Linux build</text>
  <text x="916" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#5A6472">Linux · GTK4 + Libadwaita</text>

  <text x="880" y="368" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" fill="#8B94A3">every window renders Contracts/populated.json</text>
</svg>
